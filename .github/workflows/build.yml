name: Windows build

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest -v test_product.py
      - name: Build EXE
        shell: powershell
        run: .\build_shell.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: custom-input-clicker-windows
          path: dist/连点器.exe
